<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebXR SBS Video Player</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="info">
        <h1>WebXR SBS Video Player</h1>
        <p>Click "Enter VR" button to view in VR mode</p>
    </div>

    <video 
        id="sbsVideo" 
        src="./assets/example-1-sbs.mp4" 
        loop 
        muted 
        playsinline 
        crossorigin="anonymous" 
        style="display:none;">
    </video>

    <video 
        id="sbsVideo2" 
        src="./assets/example-2-sbs.mp4" 
        loop 
        muted 
        playsinline 
        crossorigin="anonymous" 
        style="display:none;">
    </video>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="main.js"></script>
</body>
</html>
